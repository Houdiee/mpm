[package]
name = "mpm"
version = "0.2.0"
edition = "2024"
description = "Declarative package management across every package manager on your system"
license = "MIT"

[[bin]]
name = "mpm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
dirs = "6.0.0"
libc = "0.2"
which = "8.0.0"
